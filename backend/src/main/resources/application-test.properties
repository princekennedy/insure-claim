# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always

# Application Name
spring.application.name=insureclaim

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://207.180.251.44:1006/insureclaim_db}
spring.datasource.username=${DB_USERNAME:integration_hub}
spring.datasource.password=${DB_PASSWORD:qlMyNP7LyUfM3YQbyKVD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# JPA Configuration
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.format_sql=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Servlet Multipart Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# Jackson Configuration
spring.jackson.default-property-inclusion=non_null

# InsureClaim Custom Properties
insureclaim.jwt.secret=${JWT_SECRET:insureclaim-development-secret-key-change-me-in-production-0123456789}
insureclaim.jwt.issuer=${JWT_ISSUER:insureclaim-portal}
insureclaim.jwt.access-token-ttl=${JWT_ACCESS_TTL:PT15M}
insureclaim.jwt.refresh-token-ttl=${JWT_REFRESH_TTL:P7D}

insureclaim.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://insureclaim-frontend-vmnvdz-e3792c-207-180-251-44.sslip.io}

insureclaim.storage.upload-dir=${STORAGE_DIR:./data/uploads}
insureclaim.storage.max-file-size-bytes=10485760
insureclaim.storage.allowed-content-types=image/jpeg,image/png,image/webp,image/heic,application/pdf

insureclaim.claims.max-open-claims-per-customer=5
insureclaim.claims.settlement-window-days=30

insureclaim.fraud.auto-alert-threshold=60
insureclaim.fraud.high-risk-threshold=80

insureclaim.garage.performance-window-days=90
insureclaim.garage.underperforming-rating-threshold=3.0
insureclaim.garage.underperforming-complaint-threshold=5
insureclaim.garage.suspension-complaint-threshold=8
insureclaim.garage.watch-rating-threshold=3.5
insureclaim.garage.slow-turnaround-days=14
insureclaim.garage.minimum-rating-count=3

insureclaim.seed.enabled=${INSURECLAIM_SEED_ENABLED:true}
insureclaim.seed.password=${INSURECLAIM_SEED_PASSWORD:}

insureclaim.chatbot.enabled=${CHATBOT_ENABLED:true}
insureclaim.chatbot.api-key=${CHATBOT_API_KEY:}
insureclaim.chatbot.base-url=${CHATBOT_BASE_URL:https://api.anthropic.com}
insureclaim.chatbot.model=${CHATBOT_MODEL:claude-sonnet-5}
insureclaim.chatbot.max-tokens=700
insureclaim.chatbot.escalate-score-threshold=0.65

# Management Endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.health.mail.enabled=false

# SpringDoc OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Logging
logging.level.root=INFO
logging.level.com.britam.insureclaim=INFO
logging.level.org.hibernate.SQL=WARN


# MinIO Object Storage Configuration
# Set STORAGE_TYPE=minio to use MinIO instead of local filesystem
insureclaim.storage.minio-enabled=${MINIO_ENABLED:false}
insureclaim.storage.minio-endpoint=${MINIO_ENDPOINT:localhost:9000}
insureclaim.storage.minio-access-key=${MINIO_ACCESS_KEY:minioadmin}
insureclaim.storage.minio-secret-key=${MINIO_SECRET_KEY:minioadmin}
insureclaim.storage.minio-bucket=${MINIO_BUCKET:insureclaim}
insureclaim.storage.minio-use-https=${MINIO_USE_HTTPS:false}
insureclaim.storage.minio-url-expiry-seconds=${MINIO_URL_EXPIRY_SECONDS:3600}
insureclaim.storage.minio-public-bucket=${MINIO_PUBLIC_BUCKET:false}
insureclaim.storage.minio-url-base=${MINIO_URL_BASE:http://localhost:9000}
