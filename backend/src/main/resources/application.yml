server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: insureclaim
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/insureclaim}
    username: ${DB_USERNAME:insureclaim}
    password: ${DB_PASSWORD:insureclaim}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB
  jackson:
    default-property-inclusion: non_null

insureclaim:
  jwt:
    # HS256 secret. MUST be overridden in production via JWT_SECRET.
    secret: ${JWT_SECRET:insureclaim-development-secret-key-change-me-in-production-0123456789}
    issuer: ${JWT_ISSUER:insureclaim-portal}
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P7D}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  storage:
    upload-dir: ${STORAGE_DIR:./data/uploads}
    max-file-size-bytes: 10485760
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/heic
      - application/pdf
  claims:
    max-open-claims-per-customer: 5
    settlement-window-days: 30
  fraud:
    # Score above which an alert is raised automatically (0-100).
    auto-alert-threshold: 60
    high-risk-threshold: 80
  garage:
    # Rolling window used when averaging repair turnaround.
    performance-window-days: 90
    underperforming-rating-threshold: 3.0
    underperforming-complaint-threshold: 5
    suspension-complaint-threshold: 8
    watch-rating-threshold: 3.5
    slow-turnaround-days: 14
    minimum-rating-count: 3
  chatbot:
    enabled: ${CHATBOT_ENABLED:true}
    # When an API key is supplied the chatbot is proxied to an LLM provider.
    api-key: ${CHATBOT_API_KEY:}
    base-url: ${CHATBOT_BASE_URL:https://api.anthropic.com}
    model: ${CHATBOT_MODEL:claude-sonnet-5}
    max-tokens: 700
    escalate-score-threshold: 0.65

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.britam.insureclaim: INFO
    org.hibernate.SQL: WARN
