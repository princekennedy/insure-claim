# Server Configuration
server.port=${SERVER_PORT:8080}

# Backend Base URL - the public URL where this backend is accessed
# Used for generating absolute URLs, email links, etc.
insureclaim.base-url=${BACKEND_BASE_URL:http://localhost:8080}
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always
spring.profiles.active=test


# Application Name
spring.application.name=insureclaim

# Database Configuration
spring.datasource.url=${DB_URL:-}
spring.datasource.username=${DB_USERNAME:-}
spring.datasource.password=${DB_PASSWORD:-}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# JPA Configuration
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.format_sql=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Servlet Multipart Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

# Jackson Configuration
spring.jackson.default-property-inclusion=non_null


insureclaim.claims.max-open-claims-per-customer=5
insureclaim.claims.settlement-window-days=30

insureclaim.fraud.auto-alert-threshold=60
insureclaim.fraud.high-risk-threshold=80

insureclaim.garage.performance-window-days=90
insureclaim.garage.underperforming-rating-threshold=3.0
insureclaim.garage.underperforming-complaint-threshold=5
insureclaim.garage.suspension-complaint-threshold=8
insureclaim.garage.watch-rating-threshold=3.5
insureclaim.garage.slow-turnaround-days=14
insureclaim.garage.minimum-rating-count=3

insureclaim.seed.enabled=${INSURECLAIM_SEED_ENABLED:true}
insureclaim.seed.password=${INSURECLAIM_SEED_PASSWORD:}

insureclaim.chatbot.enabled=${CHATBOT_ENABLED:true}
insureclaim.chatbot.api-key=${CHATBOT_API_KEY:}
insureclaim.chatbot.base-url=${CHATBOT_BASE_URL:https://api.anthropic.com}
insureclaim.chatbot.model=${CHATBOT_MODEL:claude-sonnet-5}
insureclaim.chatbot.max-tokens=700
insureclaim.chatbot.escalate-score-threshold=0.65

# Management Endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.health.mail.enabled=false

# SpringDoc OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Logging
logging.level.root=INFO
logging.level.com.britam.insureclaim=INFO
logging.level.org.hibernate.SQL=WARN
