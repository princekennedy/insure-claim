services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: insureclaim-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
