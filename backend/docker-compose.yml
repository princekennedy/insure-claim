# InsureClaim Portal - local development stack
#
# Run the full stack:
#   docker compose up -d
#
# Or run just the database:
#   docker compose up -d db
#
# Services:
#   - db: PostgreSQL 17 (port 55432 -> 5432)
#   - adminer: Database admin UI (port 8081)
#   - backend: Spring Boot API (port 8080)
#   - frontend: Next.js app (port 3000)
#
# The database container listens on 5432 internally but is published on 55432 because
# the host already runs native PostgreSQL services that occupy 5432 and 5433.

services:
  db:
    image: postgres:17-alpine
    container_name: insureclaim-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: insureclaim
      POSTGRES_USER: insureclaim
      POSTGRES_PASSWORD: insureclaim
      # Deterministic collation so ORDER BY on text columns is reproducible.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "55432:5432"
    volumes:
      - insureclaim-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insureclaim -d insureclaim"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:5
    container_name: insureclaim-adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: insureclaim-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/insureclaim
      SPRING_DATASOURCE_USERNAME: insureclaim
      SPRING_DATASOURCE_PASSWORD: insureclaim
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_FLYWAY_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: insureclaim-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NODE_ENV: production

volumes:
  insureclaim-db-data:
